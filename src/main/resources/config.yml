#
# KoolChatFilter configuration
#

# Appeal link shown to players denied login for a local ban.
ban_url: "Your url/forum here"

# Enables additional messages at explicit debug log call sites.
debug-mode: false

# List of regular expressions. Matching is case-insensitive; accents and
# zero-width formatting characters are normalized before matching.
# Invalid expressions are logged and skipped. Patterns match any substring.
filter:
  # Reason stored for local punishments and supplied to external commands.
  reason: "Use of prohibited language"
  # The list of filtered words, phrases, or patterns. Each entry is a regular expression.
  # Example: "badword" or "badword|anotherbadword" or "(?i)badword" or "(?i)badword|anotherbadword"
  rules: []

  # Action taken for each matching filter rule:
  # PERMANENT_BAN, TEMPORARY_BAN, MUTE, KICK, WARNING, or LOG_ONLY.
  punishment: PERMANENT_BAN

  # Positive integer plus s (seconds), m (minutes), h (hours), or d (days).
  # Applies to TEMPORARY_BAN and MUTE only.
  punishment-duration: 7d

  # Optional external punishment-plugin commands. Commands run as console.
  # Supported placeholders: {player}, {uuid}, {ip}, {reason}, {duration}.
  # Configure commands to match the plugin installed on this server.
  # Leave a command empty to store/enforce that punishment via KoolChatFilter.
  external-commands:
    # Used for PERMANENT_BAN.
    ban: ""
    # Used for TEMPORARY_BAN.
    tempban: ""
    # Used for MUTE.
    mute: ""
    # Used by /permbans remove ... when removing by name, UUID, or IP.
    unban: ""