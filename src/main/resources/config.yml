#
# KoolChatFilter v1.0 Configuration File
#


# The link to the server owner's Discord server / forum page that holds ban appeals
ban_url: "https://discord.gg/MTYrSgVkmd"

# Enable debug mode?
# All debug mode will do is add extra logging if there is a FLog.debug() call to any function
debug-mode: false

# The list of words/phrases to filter.
# It is recommended to add duplicates of words in the case of accented letters.
filter:
  rules:
    - '(?i)n[\W_]*[i1!|l][\W_]*g[\W_]*g[\W_]*[ae][\W_]*(r|r+h+|h+)?s?'
    - "(?i)f[a4]g+([o0]t)?"
    - "(?i)heil hitler"
    - "(?i)seig heil"
    - "(?i)tran{2,}y"
    - "(?i)tro{2,}n"