name: KoolChatFilter
main: eu.koolfreedom.KoolChatFilter
version: '2.1'
description: Simple chat filter plugin
author: gamingto12
api-version: '26.2'

permissions:
  kfc.default:
    children:
      - kfc.command.koolchatfilter
      - kfc.command.permbans
  kfc.admin:
    children:
      - kfc.command.crash
      - kfc.command.obliterate
      - kfc.command.reload