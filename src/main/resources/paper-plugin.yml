name: KoolChatFilter
main: eu.koolfreedom.KoolChatFilter
version: ${buildVersion}
description: Simple chat filter plugin
authors:
  - "gamingto12"
  - "0x7694C9"
api-version: '26.2'

permissions:
  koolchatfilter.default:
    default: not op
    children:
      - koolchatfilter.koolchatfilter
      - koolchatfilter.permbans
  koolchatfilter.staff:
    default: op
    description: Permision node for general staff, used to handle staff-only broadcasts
  koolchatfilter.admin:
    description: Permission node dedicated for administrative tasks
    default: op